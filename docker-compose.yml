# DEVELOPMENT ONLY
# This Compose file is for local development only.

services:
  postgres:
    image: postgres:latest
    container_name: kochy-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kochy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kochy_dev_password}
      POSTGRES_USER: ${POSTGRES_USER:-kochy}
    ports:
      - "5432:5432"
    volumes:
      - kochy-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kochy-postgres-data:
